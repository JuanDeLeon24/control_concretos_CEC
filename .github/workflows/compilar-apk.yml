name: Compilar APK Control Concreto
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verificar estructura del proyecto
        run: |
          test -f settings.gradle.kts && test -f app/build.gradle.kts && test -f app/condor.jks
          echo "Archivos Kotlin en app/:"
          ls app/src/main/java/co/obra/controlconcreto/
          echo "Total: $(ls app/src/main/java/co/obra/controlconcreto/*.kt | wc -l) (deben ser 17)"
      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ControlConcreto-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
